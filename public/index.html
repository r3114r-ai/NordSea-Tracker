<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NordSea Export — Wholesale Fish &amp; Seafood Supplier</title>
<meta name="description" content="B2B supplier of frozen fish, seafood and caviar. FOB / CIF export terms.">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html"><img src="/img/logo.svg" alt="NordSea Export" height="34"></a>
    <nav class="nav-links">
      <a href="index.html" class="active" data-i18n="nav.home"></a>
      <a href="products.html" data-i18n="nav.products"></a>
      <a href="terms.html" data-i18n="nav.terms"></a>
      <a href="about.html" data-i18n="nav.about"></a>
      <a href="contacts.html" data-i18n="nav.contacts"></a>
      <a href="inquiry.html" class="cta" data-i18n="nav.inquiry"></a>
    </nav>
    <div class="lang-switch hidden-until-i18n">
      <button data-lang="en">EN</button><button data-lang="ru">RU</button>
    </div>
    <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container">
      <span class="badge" data-i18n="hero.badge"></span>
      <h1 data-i18n="hero.title"></h1>
      <p data-i18n="hero.sub"></p>
      <div class="actions">
        <a class="btn btn-primary" href="inquiry.html" data-i18n="hero.cta"></a>
        <a class="btn btn-outline" href="products.html" data-i18n="hero.cta2"></a>
      </div>
    </div>
  </section>

  <div class="stats">
    <div class="container">
      <div class="stat"><b>20+</b><span data-i18n="stats.years"></span></div>
      <div class="stat"><b>30+</b><span data-i18n="stats.countries"></span></div>
      <div class="stat"><b>40</b><span data-i18n="stats.fcl"></span></div>
    </div>
  </div>

  <section class="block">
    <div class="container">
      <div class="section-head">
        <h2 data-i18n="home.categories.title"></h2>
        <p data-i18n="home.categories.sub"></p>
      </div>
      <div class="cat-grid" id="home-cats"></div>
    </div>
  </section>

  <section class="block alt">
    <div class="container">
      <div class="section-head">
        <h2 data-i18n="home.how.title"></h2>
        <p data-i18n="home.how.sub"></p>
      </div>
      <div class="steps-grid">
        <div class="step-card"><h3 data-i18n="home.how.s1.title"></h3><p data-i18n="home.how.s1.text"></p></div>
        <div class="step-card"><h3 data-i18n="home.how.s2.title"></h3><p data-i18n="home.how.s2.text"></p></div>
        <div class="step-card"><h3 data-i18n="home.how.s3.title"></h3><p data-i18n="home.how.s3.text"></p></div>
      </div>
    </div>
  </section>

  <section class="cta-band">
    <div class="container inner">
      <div>
        <h2 data-i18n="home.cta.title"></h2>
        <p data-i18n="home.cta.text"></p>
      </div>
      <a class="btn btn-primary" href="inquiry.html" data-i18n="home.cta.button"></a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <img src="/img/logo-light.svg" alt="NordSea Export" height="40">
        <p style="margin-top:12px;font-size:14px" data-i18n="footer.tagline"></p>
      </div>
      <div>
        <h4 data-i18n="footer.nav"></h4>
        <a href="index.html" data-i18n="nav.home"></a>
        <a href="products.html" data-i18n="nav.products"></a>
        <a href="terms.html" data-i18n="nav.terms"></a>
        <a href="inquiry.html" data-i18n="nav.inquiry"></a>
      </div>
      <div>
        <h4 data-i18n="footer.contact"></h4>
        <a href="mailto:sales@nordsea-export.com">sales@nordsea-export.com</a>
        <a href="tel:+74230000000" data-i18n="contacts.phone.value"></a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© <span id="year">2026</span> NordSea Export — <span data-i18n="footer.rights"></span></span>
      <span data-i18n="footer.priceNote"></span>
    </div>
  </div>
</footer>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/catalog.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
