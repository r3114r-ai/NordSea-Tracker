<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooperation Terms — NordSea Export</title>
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html"><img src="/img/logo.svg" alt="NordSea Export" height="34"></a>
    <nav class="nav-links">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="products.html" data-i18n="nav.products"></a>
      <a href="terms.html" class="active" data-i18n="nav.terms"></a>
      <a href="about.html" data-i18n="nav.about"></a>
      <a href="contacts.html" data-i18n="nav.contacts"></a>
      <a href="inquiry.html" class="cta" data-i18n="nav.inquiry"></a>
    </nav>
    <div class="lang-switch hidden-until-i18n">
      <button data-lang="en">EN</button><button data-lang="ru">RU</button>
    </div>
    <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
  <div class="container page-head">
    <h1 data-i18n="terms.title"></h1>
    <p data-i18n="terms.sub"></p>
  </div>

  <section class="block" style="padding-top:34px">
    <div class="container">
      <div class="terms-grid">
        <div class="term-card"><div class="icon">🚢</div><h3 data-i18n="terms.b1.title"></h3><p data-i18n="terms.b1.text"></p></div>
        <div class="term-card"><div class="icon">🤝</div><h3 data-i18n="terms.b2.title"></h3><p data-i18n="terms.b2.text"></p></div>
        <div class="term-card"><div class="icon">📄</div><h3 data-i18n="terms.b3.title"></h3><p data-i18n="terms.b3.text"></p></div>
        <div class="term-card"><div class="icon">❄️</div><h3 data-i18n="terms.b4.title"></h3><p data-i18n="terms.b4.text"></p></div>
      </div>
    </div>
  </section>

  <section class="cta-band">
    <div class="container inner">
      <div>
        <h2 data-i18n="home.cta.title"></h2>
        <p data-i18n="home.cta.text"></p>
      </div>
      <a class="btn btn-primary" href="inquiry.html" data-i18n="terms.cta"></a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <img src="/img/logo-light.svg" alt="NordSea Export" height="40">
        <p style="margin-top:12px;font-size:14px" data-i18n="footer.tagline"></p>
      </div>
      <div>
        <h4 data-i18n="footer.nav"></h4>
        <a href="index.html" data-i18n="nav.home"></a>
        <a href="products.html" data-i18n="nav.products"></a>
        <a href="inquiry.html" data-i18n="nav.inquiry"></a>
      </div>
      <div>
        <h4 data-i18n="footer.contact"></h4>
        <a href="mailto:sales@nordsea-export.com">sales@nordsea-export.com</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© <span id="year">2026</span> NordSea Export — <span data-i18n="footer.rights"></span></span>
      <span data-i18n="footer.priceNote"></span>
    </div>
  </div>
</footer>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
